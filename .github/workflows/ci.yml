name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest -q

      - name: Verify witness proof objects
        run: python verify_witness_proof_object.py --inputs results --invariant-tol 1e-10 --strict

      - name: Run independent witness verifier
        run: python verify_witness_independent_91.py --inputs results --strict

      - name: Verify bridge step
        run: python verify_bridge_step_91.py --strict

      - name: Verify bridge transfer
        run: python verify_bridge_transfer_91.py

      - name: Verify bridge step (exception-aware n=36)
        run: >-
          python verify_bridge_step_91.py
          --transitions 34:36,36:38,34:38
          --required-core-family any
          --exceptional-indices 36
          --hypothesis-id H91-bridge-step-v2-exception36
          --out-json results/bridge_step_hypothesis_91_window_34_38_exception36.json
          --out-md results/bridge_step_verification_91_window_34_38_exception36.md
          --strict

      - name: Verify bridge transfer (exception-aware n=36)
        run: >-
          python verify_bridge_transfer_91.py
          --step-hypothesis results/bridge_step_hypothesis_91_window_34_38_exception36.json
          --asymptotic results/asymptotic_signal_91.json
          --window 34:38:42
          --out-json results/bridge_transfer_proof_91_window_34_38_exception36.json
          --out-md results/bridge_window_composition_91_window_34_38_exception36.md

      - name: Build ladder status matrix
        run: python build_ladder_status.py --manifest proof_ladder_manifest.json --out ladder_status.md
