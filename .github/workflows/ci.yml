name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest -q

      - name: Verify witness proof objects
        run: python verify_witness_proof_object.py --inputs results --invariant-tol 1e-10 --strict

      - name: Run independent witness verifier
        run: python verify_witness_independent_91.py --inputs results --strict

      - name: Verify bridge step
        run: python verify_bridge_step_91.py --strict

      - name: Verify bridge transfer
        run: python verify_bridge_transfer_91.py
